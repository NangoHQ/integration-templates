name: Compile Templates

on:
    push:
        branches:
            - main
            - staging/**
    pull_request:

concurrency:
    group: flows-compile--${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    flow-compilation:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  cache: 'npm'
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: |
                  npm ci

            - name: Compile
              working-directory: integrations
              # `nango compile` type-checks every integration as a single TS program, so memory use
              # grows with the size of this repo. Default V8 heap (~4GB) is no longer enough and the
              # step intermittently OOMs (exit 134) even on PRs unrelated to the one that tips it over.
              env:
                  NODE_OPTIONS: '--max-old-space-size=8192'
              run: npx nango compile
